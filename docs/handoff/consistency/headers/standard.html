<!DOCTYPE html>
<html lang="en" data-look="pop">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Header: standard (Today and Day)</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Gochi+Hand&family=Nunito:wght@400;600;700;800&family=Patrick+Hand&family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../../css/app.css">
<link rel="stylesheet" href="headers.css">
</head><body>
<div class="panel"><div class="gap">Today: no back button (it is in the bottom menu)</div>
<header class="ph ph--standard" data-name="standard-today"><div class="ph-row ph-main" data-m="row">
<h2 class="ph-title">Today</h2><div class="ph-context">Thu 8 Oct</div>
<div class="ph-actions"><button class="ph-btn" data-m="button" aria-label="Copy the day">📋</button><button class="ph-btn" data-m="button" aria-label="How this page works">?</button></div>
<div class="ph-badge" data-m="badge"><span class="ph-av" aria-hidden="true">J</span> Jenn</div></div></header>
<div class="pg"><div class="pg-card"><b>Today</b><br>Page content carries on here, below the header.</div></div></div>
<div class="panel"><div class="gap">Day: with a back button (Day is not in the bottom menu)</div>
<header class="ph ph--standard" data-name="standard-day"><div class="ph-row ph-main" data-m="row">
<button class="ph-btn" data-m="button" aria-label="Back to Week">◀</button><h2 class="ph-title">Day</h2><div class="ph-context">Thu 8 Oct</div>
<div class="ph-actions"><button class="ph-btn" data-m="button" aria-label="Copy the day">📋</button><button class="ph-btn" data-m="button" aria-label="How this page works">?</button></div>
<div class="ph-badge" data-m="badge"><span class="ph-av" aria-hidden="true">J</span> Jenn</div></div></header>
<div class="pg"><div class="pg-card"><b>Day</b><br>Page content carries on here, below the header.</div></div></div>
<pre id="measure"></pre><script src="headers.js"></script></body></html>
